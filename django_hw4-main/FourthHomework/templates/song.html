<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Текст пісні - {{ title }}</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 600px;
            border-left: 5px solid #ff007f;
        }
        .lyrics {
            white-space: pre-line; /* Заміна <pre> */
            font-size: 1.2rem;
            line-height: 1.8;
            margin-bottom: 25px;
        }
        nav a {
            color: #ff007f;
            text-decoration: none;
            margin: 0 10px;
            font-weight: bold;
        }
        nav a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>{{ title }}</h1>
        <div class="lyrics">
            {{ text }}
        </div>
        <hr>
        <nav>
            <a href="/">English</a>
            <a href="/fr">Français</a>
            <a href="/de">Deutsch</a>
            <a href="/es">Español</a>
        </nav>
    </div>
</body>
</html>
